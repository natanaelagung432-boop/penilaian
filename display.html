<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Display Hasil Penilaian</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#080b12;
  color:#fff;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  text-align:center;
  padding:28px 20px 20px;
}

.title{
  margin:0;
  font-size:clamp(28px,5vw,54px);
  font-weight:800;
  letter-spacing:.5px;
}

.subtitle{
  margin-top:8px;
  color:#9ca3af;
  font-size:clamp(13px,2vw,18px);
}

.container{
  width:min(1100px,94%);
  margin:0 auto;
  padding:8px 0 35px;
}

.table{
  width:100%;
  border-collapse:separate;
  border-spacing:0 9px;
}

.table th{
  color:#8f98a8;
  font-size:13px;
  padding:8px 16px;
  text-align:left;
  letter-spacing:1px;
}

.table th:first-child{
  width:100px;
  text-align:center;
}

.table th:last-child{
  text-align:right;
}

.table td{
  background:#151a24;
  padding:20px 16px;
  font-size:clamp(20px,3vw,34px);
}

.table td:first-child{
  border-radius:14px 0 0 14px;
  text-align:center;
}

.table td:last-child{
  border-radius:0 14px 14px 0;
  text-align:right;
}

.rank{
  font-weight:800;
  font-variant-numeric:tabular-nums;
}

.name{
  font-weight:700;
}

.total{
  font-weight:800;
  font-variant-numeric:tabular-nums;
}

.top1 td{
  background:#25210f;
}

.top2 td{
  background:#20242a;
}

.top3 td{
  background:#272019;
}

.empty{
  text-align:center!important;
  color:#7f8999!important;
  padding:50px!important;
  border-radius:14px!important;
}

.footer{
  margin-top:auto;
  text-align:center;
  padding:12px;
  color:#667085;
  font-size:12px;
}

.connection{
  position:fixed;
  right:12px;
  bottom:12px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border-radius:20px;
  background:#151a24;
  color:#9ca3af;
  font-size:11px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#f59e0b;
}

@media(max-width:600px){
  .header{
    padding:20px 12px 12px;
  }

  .container{
    width:96%;
  }

  .table{
    border-spacing:0 6px;
  }

  .table th,
  .table td{
    padding:13px 9px;
  }

  .table th:first-child{
    width:55px;
  }

  .table td{
    font-size:20px;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1 class="title" id="title">HASIL PENILAIAN</h1>
  <div class="subtitle" id="subtitle">Realtime</div>
</header>

<main class="container">
  <table class="table">
    <thead>
      <tr>
        <th>RANK</th>
        <th>NAMA</th>
        <th>HASIL</th>
      </tr>
    </thead>
    <tbody id="result">
      <tr>
        <td colspan="3" class="empty">Memuat data...</td>
      </tr>
    </tbody>
  </table>
</main>

<div class="footer">Penilaian Realtime</div>

<div class="connection">
  <span class="dot" id="connectionDot"></span>
  <span id="connectionText">Menghubungkan...</span>
</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


/* =========================================================
   FIREBASE CONFIG
   ========================================================= */

const firebaseConfig={
  apiKey:"AIzaSyCx9UhOogtxuaqeXqNerXBqPNhCT441-k4",
  authDomain:"penilaian-ea638.firebaseapp.com",
  databaseURL:"https://penilaian-ea638-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"penilaian-ea638",
  storageBucket:"penilaian-ea638.firebasestorage.app",
  messagingSenderId:"676085464375",
  appId:"1:676085464375:web:3ff014f7e736a2021a6eb2"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);


/* =========================================================
   DATA
   ========================================================= */

let participants={};
let rounds={};
let scores={};


/* =========================================================
   CONNECTION STATUS
   ========================================================= */

onValue(ref(db,".info/connected"),snapshot=>{

  const connected=snapshot.val()===true;

  document.getElementById("connectionText").textContent=
    connected ? "Terhubung" : "Terputus";

  document.getElementById("connectionDot").style.background=
    connected ? "#22c55e" : "#ef4444";

});


/* =========================================================
   REALTIME PARTICIPANTS
   ========================================================= */

onValue(ref(db,"competition/participants"),snapshot=>{

  participants=snapshot.val()||{};

  render();

});


/* =========================================================
   REALTIME ROUNDS
   ========================================================= */

onValue(ref(db,"competition/rounds"),snapshot=>{

  rounds=snapshot.val()||{};

  render();

});


/* =========================================================
   REALTIME SCORES
   ========================================================= */

onValue(ref(db,"competition/scores"),snapshot=>{

  scores=snapshot.val()||{};

  render();

});


/* =========================================================
   RENDER RANKING
   ========================================================= */

function render(){

  const rows=Object.entries(participants).map(([id,participant])=>{

    let total=0;

    Object.keys(rounds).forEach(roundId=>{

      total+=Number(
        scores?.[roundId]?.[id] ?? 0
      );

    });

    return{
      id,
      name:participant.name || "Tanpa Nama",
      order:Number(participant.order)||0,
      total
    };

  });


  /*
    Ranking:
    total terbesar berada di atas.
    Jika total sama, urutan peserta
    mengikuti urutan server.
  */

  rows.sort((a,b)=>{

    if(b.total!==a.total){
      return b.total-a.total;
    }

    return a.order-b.order;

  });


  const body=document.getElementById("result");

  body.innerHTML="";


  if(!rows.length){

    body.innerHTML=`
      <tr>
        <td colspan="3" class="empty">
          Belum ada peserta
        </td>
      </tr>
    `;

    document.getElementById("subtitle").textContent=
      "Belum ada data";

    return;
  }


  document.getElementById("subtitle").textContent=
    `${rows.length} peserta • ${Object.keys(rounds).length} ronde • realtime`;


  rows.forEach((row,index)=>{

    const rank=index+1;

    const tr=document.createElement("tr");

    if(rank===1)tr.className="top1";
    else if(rank===2)tr.className="top2";
    else if(rank===3)tr.className="top3";


    tr.innerHTML=`
      <td class="rank">${rank}</td>
      <td class="name">${escapeHtml(row.name)}</td>
      <td class="total">${formatNumber(row.total)}</td>
    `;


    body.appendChild(tr);

  });

}


/* =========================================================
   FORMAT
   ========================================================= */

function formatNumber(value){

  return Number(value).toLocaleString("id-ID");

}


function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
