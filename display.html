<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Display Hasil Penilaian</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#fff;font-family:Arial,Helvetica,sans-serif}
header{padding:22px 25px;text-align:center}
h1{margin:0;font-size:clamp(25px,4vw,46px)}
.subtitle{margin-top:7px;color:#aab2c0;font-size:clamp(13px,2vw,18px)}
main{max-width:1100px;margin:auto;padding:10px 20px 30px}
table{width:100%;border-collapse:separate;border-spacing:0 8px}
th{text-align:left;color:#8e98a9;font-size:13px;padding:5px 14px}
td{background:#151a24;padding:17px 14px;font-size:clamp(18px,3vw,30px)}
tr td:first-child{border-radius:12px 0 0 12px;width:90px;text-align:center;font-weight:bold}
tr td:last-child{border-radius:0 12px 12px 0;text-align:right;font-weight:bold}
.rank{font-size:clamp(22px,3vw,34px)}
.name{font-weight:bold}
.total{font-variant-numeric:tabular-nums}
.up{animation:up .6s ease}
@keyframes up{50%{transform:scale(1.04)}}
.empty{text-align:center;color:#8e98a9;padding:50px}
@media(max-width:600px){
 main{padding:5px 9px 20px}
 td{padding:13px 9px}
 th{padding:4px 9px}
 tr td:first-child{width:65px}
}
</style>
</head>
<body>
<header>
<h1 id="title">HASIL PENILAIAN</h1>
<div class="subtitle" id="roundInfo">Realtime</div>
</header>
<main>
<table>
<thead><tr><th>RANK</th><th>NAMA</th><th style="text-align:right">HASIL</th></tr></thead>
<tbody id="result"></tbody>
</table>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

/* ===== ISI DENGAN CONFIG FIREBASE ANDA ===== */
const firebaseConfig={
  apiKey:"ISI_API_KEY",
  authDomain:"ISI_PROJECT.firebaseapp.com",
  databaseURL:"https://ISI_PROJECT-default-rtdb.firebaseio.com",
  projectId:"ISI_PROJECT",
  storageBucket:"ISI_PROJECT.firebasestorage.app",
  messagingSenderId:"ISI_MESSAGING_SENDER_ID",
  appId:"ISI_APP_ID"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

let rounds={},participants={},scores={},previousOrder=[];

onValue(ref(db,"competition/rounds"),s=>{rounds=s.val()||{};render()});
onValue(ref(db,"competition/participants"),s=>{participants=s.val()||{};render()});
onValue(ref(db,"competition/scores"),s=>{scores=s.val()||{};render()});

function render(){
  const rows=Object.entries(participants).map(([id,p])=>{
    let total=0;
    for(const rid of Object.keys(rounds)){
      total+=Number(scores?.[rid]?.[id]??0);
    }
    return {id,name:p.name||"Tanpa Nama",total};
  }).sort((a,b)=>b.total-a.total);

  const roundCount=Object.keys(rounds).length;
  document.getElementById("roundInfo").textContent=
    roundCount?`${roundCount} ronde • update realtime`:"Belum ada ronde";

  const body=document.getElementById("result");
  body.innerHTML="";

  if(!rows.length){
    body.innerHTML='<tr><td colspan="3" class="empty">Belum ada peserta</td></tr>';
    previousOrder=[];return;
  }

  rows.forEach((r,i)=>{
    const tr=document.createElement("tr");
    const oldIndex=previousOrder.indexOf(r.id);
    if(oldIndex!==-1 && oldIndex!==i)tr.classList.add("up");
    tr.innerHTML=`
      <td class="rank">${i+1}</td>
      <td class="name">${esc(r.name)}</td>
      <td class="total">${format(r.total)}</td>`;
    body.appendChild(tr);
  });

  previousOrder=rows.map(r=>r.id);
}

function format(n){
  return Number.isInteger(n)?n:n.toLocaleString("id-ID");
}
function esc(v){
  return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
</script>
</body>
</html>
