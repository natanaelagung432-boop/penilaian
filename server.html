<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Server Penilaian Realtime</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f4f7;color:#172033}
header{background:#111827;color:#fff;padding:16px 20px;position:sticky;top:0;z-index:20}
.header-inner{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}
h1{margin:0;font-size:21px}.status{display:flex;align-items:center;gap:7px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#f59e0b}
.container{max-width:1200px;margin:auto;padding:18px}
.panel{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.title{font-size:18px;font-weight:bold;margin-bottom:14px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
input{font:inherit;border:1px solid #d1d5db;border-radius:9px;padding:10px 12px;background:#fff}
button{font:inherit;border:0;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:bold}
button:active{transform:scale(.97)}
.primary{background:#2563eb;color:#fff}.success{background:#16a34a;color:#fff}
.danger{background:#dc2626;color:#fff}.light{background:#e5e7eb;color:#111827}
.rounds{display:flex;gap:8px;flex-wrap:wrap}
.round{background:#e5e7eb;color:#111827}.round.active{background:#2563eb;color:#fff}
.participant{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-bottom:11px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px}
.info{display:flex;align-items:center;gap:10px;min-width:0}
.num{width:38px;height:38px;border-radius:10px;background:#eef2ff;color:#3730a3;display:flex;align-items:center;justify-content:center;font-weight:bold;flex:none}
.name{font-size:17px;font-weight:bold;word-break:break-word}.sub{font-size:12px;color:#6b7280}
.score{font-size:28px;font-weight:bold;min-width:90px;text-align:right}
.controls{display:flex;gap:7px;flex-wrap:wrap}
.scorebtn{min-width:58px}.minus{background:#fee2e2;color:#991b1b}.plus{background:#dcfce7;color:#166534}
.empty{text-align:center;padding:30px;color:#6b7280}
@media(max-width:650px){
 .container{padding:10px}.header-inner{align-items:flex-start;flex-direction:column}
 .head{align-items:flex-start}.score{font-size:24px;min-width:auto}.scorebtn{flex:1}
 .controls button{min-width:65px}
}


.score-table{width:100%;border-collapse:separate;border-spacing:0 7px;min-width:760px}
.score-table th{background:#111827;color:#fff;padding:12px 10px;text-align:center;font-size:13px;white-space:nowrap}
.score-table th:first-child{border-radius:9px 0 0 9px;text-align:left}
.score-table th:last-child{border-radius:0 9px 9px 0}
.score-table td{background:#f8fafc;border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;padding:9px 8px;text-align:center;vertical-align:middle}
.score-table td:first-child{border-left:1px solid #e5e7eb;border-radius:9px 0 0 9px;text-align:left}
.score-table td:last-child{border-right:1px solid #e5e7eb;border-radius:0 9px 9px 0}
.name-input{width:170px;padding:9px;border:1px solid #d1d5db;border-radius:8px;font-weight:bold}
.score-cell{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}
.score-value{font-size:18px;font-weight:bold;min-width:42px}
.cell-btn{padding:7px 9px;font-size:12px;border-radius:7px}
.cell-plus{background:#dcfce7;color:#166534}
.cell-minus{background:#fee2e2;color:#991b1b}
.cell-edit{background:#e5e7eb;color:#111827}
.total-cell{font-size:20px;font-weight:bold;min-width:90px}
</style>
</head>
<body>
<header><div class="header-inner">
<div>
<h1>Server Penilaian Realtime</h1>
<div style="font-size:12px;color:#9ca3af;margin-top:3px">Operator / Juri</div>
</div>
<div style="display:flex;align-items:center;gap:14px">
<a href="./setting.html" style="color:#fff;text-decoration:none;background:#374151;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:bold">⚙ Setting</a>
<div class="status"><span class="dot" id="dot"></span><span id="status">Menghubungkan...</span></div>
</div>
</div></header>

<main class="container">
<div id="errorBox" style="display:none;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:14px;white-space:pre-wrap"></div>
<section class="panel">
<div class="title">Ronde</div>
<div class="rounds" id="roundList"></div>
<div class="row" style="margin-top:14px">
<input id="roundName" placeholder="Nama ronde, contoh: Ronde 1">
<button class="primary" id="addRound">+ Tambah Ronde</button>
</div>
</section>

<section class="panel">
<div class="title">Peserta</div>
<div class="row">
<input id="participantName" placeholder="Nama peserta" style="min-width:220px">
<button class="success" id="addParticipant">+ Tambah Peserta</button>
</div>
<div class="sub" style="margin-top:9px">Urutan peserta di server tetap. Ranking hanya dihitung di display.</div>
</section>

<section class="panel">
<div class="title">Penilaian</div>
<div class="sub" style="margin-bottom:12px">Setiap baris adalah peserta. Kolom menunjukkan ronde. Total berada di paling kanan.</div>
<div style="overflow-x:auto">
<table class="score-table">
<thead id="scoreHead"></thead>
<tbody id="scoreBody"></tbody>
</table>
</div>
</section>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getDatabase,ref,onValue,set,update,push,remove,runTransaction} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

/* Firebase Config */
import { firebaseConfig } from "./config.js";

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

let rounds={},participants={},scores={};
let activeRoundId=null;
let seedChecked=false;
let scoreControls={minus:[10,1],plus:[1,10]};

const $=id=>document.getElementById(id);

onValue(ref(db,".info/connected"),s=>{
  const ok=s.val()===true;
  $("status").textContent=ok?"Realtime terhubung":"Tidak terhubung";
  $("dot").style.background=ok?"#22c55e":"#ef4444";
});

onValue(ref(db,"competition/rounds"),async s=>{
  rounds=s.val()||{};
  const ids=Object.keys(rounds);
  if(!activeRoundId || !rounds[activeRoundId]) activeRoundId=ids[0]||null;
  renderRounds(); render();
  await seedDefaults();
});

onValue(ref(db,"competition/participants"),s=>{
  participants=s.val()||{}; render();
});

onValue(ref(db,"competition/scores"),s=>{
  scores=s.val()||{}; render();
});

onValue(ref(db,"competition/settings/scoreControls"),s=>{
  const v=s.val()||{};
  scoreControls={
    minus:[Number(v?.minus?.[0])||10,Number(v?.minus?.[1])||1],
    plus:[Number(v?.plus?.[0])||1,Number(v?.plus?.[1])||10]
  };
  render();
});

async function seedDefaults(){
  if(seedChecked) return;
  seedChecked=true;

  try{
    const hasRounds=Object.keys(rounds).length>0;
    const hasParticipants=Object.keys(participants).length>0;

    const updates={};

    if(!hasRounds && !hasParticipants){
      // Data awal dibuat di bawah.
    }

    // Nilai tombol default: -10, -1, +1, +10
    if(!scoreControls || !scoreControls.minus || !scoreControls.plus){
      updates["competition/settings/scoreControls"]={
        minus:[10,1],
        plus:[1,10]
      };
      scoreControls={minus:[10,1],plus:[1,10]};
    }

    if(hasRounds && hasParticipants && Object.keys(updates).length===0) return;

    if(!hasRounds){
      const roundIds=["round_001","round_002","round_003"];
      const names=["Ronde 1","Ronde 2","Ronde 3"];
      roundIds.forEach((id,i)=>{
        updates[`competition/rounds/${id}`]={
          name:names[i],
          order:i+1,
          createdAt:Date.now()
        };
      });
      activeRoundId="round_001";
      updates["competition/settings/activeRoundId"]="round_001";
    }

    if(!hasParticipants){
      const participantIds=["participant_001","participant_002","participant_003","participant_004","participant_005"];
      participantIds.forEach((id,i)=>{
        updates[`competition/participants/${id}`]={
          name:`Peserta ${i+1}`,
          order:i+1,
          createdAt:Date.now()
        };
      });
    }

    if(Object.keys(updates).length){
      await update(ref(db),updates);
    }
  }catch(e){
    showError(e);
  }
}

$("addRound").onclick=async()=>{
  try{
    const name=$("roundName").value.trim();
    if(!name)return alert("Masukkan nama ronde.");
    const r=push(ref(db,"competition/rounds"));
    const maxOrder=Object.values(rounds).reduce((m,x)=>Math.max(m,Number(x?.order)||0),0);
    await set(r,{name,order:maxOrder+1,createdAt:Date.now()});
    activeRoundId=r.key;
    $("roundName").value="";
    $("errorBox").style.display="none";
    renderRounds(); render();
  }catch(e){showError(e)}
};

$("addParticipant").onclick=async()=>{
  try{
    const name=$("participantName").value.trim();
    if(!name)return alert("Masukkan nama peserta.");
    const r=push(ref(db,"competition/participants"));
    const maxOrder=Object.values(participants).reduce((m,x)=>Math.max(m,Number(x?.order)||0),0);
    await set(r,{name,order:maxOrder+1,createdAt:Date.now()});
    $("participantName").value="";
    $("errorBox").style.display="none";
    render();
  }catch(e){showError(e)}
};

function renderRounds(){
  const box=$("roundList"); box.innerHTML="";
  Object.entries(rounds).sort((a,b)=>(a[1].order||0)-(b[1].order||0)).forEach(([id,r])=>{
    const b=document.createElement("button");
    b.className="round "+(id===activeRoundId?"active":"");
    b.textContent=r.name||"Ronde";
    b.onclick=async()=>{
      try{
        activeRoundId=id;
        await set(ref(db,"competition/settings/activeRoundId"),id);
        renderRounds(); render();
      }catch(e){showError(e)}
    };
    box.appendChild(b);
  });
  if(!Object.keys(rounds).length)box.innerHTML='<div class="sub">Belum ada ronde.</div>';
}

function render(){
  const head=$("scoreHead");
  const body=$("scoreBody");

  const roundList=Object.entries(rounds)
    .sort((a,b)=>(a[1].order||0)-(b[1].order||0));

  head.innerHTML=`<tr>
    <th>Peserta</th>
    ${roundList.map(([id,r])=>`<th>${esc(r.name||id)}</th>`).join("")}
    <th>TOTAL</th>
  </tr>`;

  const list=Object.entries(participants)
    .sort((a,b)=>(a[1].order||0)-(b[1].order||0));

  if(!list.length){
    body.innerHTML=`<tr><td colspan="${roundList.length+2}" class="empty">Belum ada peserta.</td></tr>`;
    return;
  }

  body.innerHTML="";
  list.forEach(([pid,p])=>{
    let total=0;
    const tr=document.createElement("tr");

    const nameTd=document.createElement("td");
    nameTd.innerHTML=`
      <div style="display:flex;align-items:center;gap:6px">
        <input class="name-input" value="${escAttr(p.name||"")}" data-name-id="${pid}">
        <button class="cell-btn cell-edit save-name" data-id="${pid}">Simpan</button>
      </div>`;
    tr.appendChild(nameTd);

    roundList.forEach(([rid])=>{
      const value=Number(scores?.[rid]?.[pid]??0);
      total+=value;

      const td=document.createElement("td");
      td.innerHTML=`
        <div class="score-cell">
          <button class="cell-btn cell-minus score-action" data-rid="${rid}" data-pid="${pid}" data-delta="-${scoreControls.minus[0]}">−${scoreControls.minus[0]}</button>
          <button class="cell-btn cell-minus score-action" data-rid="${rid}" data-pid="${pid}" data-delta="-${scoreControls.minus[1]}">−${scoreControls.minus[1]}</button>
          <span class="score-value">${value}</span>
          <button class="cell-btn cell-plus score-action" data-rid="${rid}" data-pid="${pid}" data-delta="${scoreControls.plus[0]}">+${scoreControls.plus[0]}</button>
          <button class="cell-btn cell-plus score-action" data-rid="${rid}" data-pid="${pid}" data-delta="${scoreControls.plus[1]}">+${scoreControls.plus[1]}</button>
        </div>`;
      tr.appendChild(td);
    });

    const totalTd=document.createElement("td");
    totalTd.className="total-cell";
    totalTd.textContent=total;
    tr.appendChild(totalTd);

    body.appendChild(tr);
  });

  body.querySelectorAll(".score-action").forEach(b=>{
    b.onclick=()=>changeScoreForRound(b.dataset.rid,b.dataset.pid,Number(b.dataset.delta));
  });

  body.querySelectorAll(".save-name").forEach(b=>{
    b.onclick=()=>saveName(b.dataset.id);
  });
}

async function changeScoreForRound(rid,pid,delta){
  try{
    const r=ref(db,`competition/scores/${rid}/${pid}`);
    await runTransaction(r,current=>Number(current||0)+delta);
  }catch(e){showError(e)}
}

async function saveName(pid){
  try{
    const input=document.querySelector(`[data-name-id="${CSS.escape(pid)}"]`);
    if(!input)return;
    const name=input.value.trim();
    if(!name)return alert("Nama tidak boleh kosong.");
    await update(ref(db,`competition/participants/${pid}`),{name});
  }catch(e){showError(e)}
}


async function changeScore(id,delta){
  try{
    if(!activeRoundId){
      alert("Pilih atau buat ronde terlebih dahulu.");
      return;
    }
    const r=ref(db,`competition/scores/${activeRoundId}/${id}`);
    await runTransaction(r,current=>{
      const n=Number(current||0)+delta;
      return Math.max(0,n);
    });
  }catch(e){showError(e)}
}


function showError(e){
  console.error(e);
  const code=e?.code||"unknown";
  const msg=e?.message||String(e);
  const box=$("errorBox");
  box.style.display="block";
  box.textContent="Firebase error: "+code+"\\n"+msg+"\\n\\nPeriksa Realtime Database dan Rules Firebase.";
}

function esc(v){
  return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function escAttr(v){
  return esc(v).replaceAll("`","&#096;");
}
</script>
</body>
</html>
