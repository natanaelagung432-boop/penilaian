<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Server Penilaian Realtime</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f4f7;color:#172033}
header{background:#111827;color:#fff;padding:16px 20px;position:sticky;top:0;z-index:20}
.header-inner{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}
h1{margin:0;font-size:21px}.status{display:flex;align-items:center;gap:7px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#f59e0b}
.container{max-width:1200px;margin:auto;padding:18px}
.panel{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.title{font-size:18px;font-weight:bold;margin-bottom:14px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
input{font:inherit;border:1px solid #d1d5db;border-radius:9px;padding:10px 12px;background:#fff}
button{font:inherit;border:0;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:bold}
button:active{transform:scale(.97)}
.primary{background:#2563eb;color:#fff}.success{background:#16a34a;color:#fff}
.danger{background:#dc2626;color:#fff}.light{background:#e5e7eb;color:#111827}
.rounds{display:flex;gap:8px;flex-wrap:wrap}
.round{background:#e5e7eb;color:#111827}.round.active{background:#2563eb;color:#fff}
.participant{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-bottom:11px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px}
.info{display:flex;align-items:center;gap:10px;min-width:0}
.num{width:38px;height:38px;border-radius:10px;background:#eef2ff;color:#3730a3;display:flex;align-items:center;justify-content:center;font-weight:bold;flex:none}
.name{font-size:17px;font-weight:bold;word-break:break-word}.sub{font-size:12px;color:#6b7280}
.score{font-size:28px;font-weight:bold;min-width:90px;text-align:right}
.controls{display:flex;gap:7px;flex-wrap:wrap}
.scorebtn{min-width:58px}.minus{background:#fee2e2;color:#991b1b}.plus{background:#dcfce7;color:#166534}
.empty{text-align:center;padding:30px;color:#6b7280}
@media(max-width:650px){
 .container{padding:10px}.header-inner{align-items:flex-start;flex-direction:column}
 .head{align-items:flex-start}.score{font-size:24px;min-width:auto}.scorebtn{flex:1}
 .controls button{min-width:65px}
}
</style>
</head>
<body>
<header><div class="header-inner">
<h1>Server Penilaian Realtime</h1>
<div class="status"><span class="dot" id="dot"></span><span id="status">Menghubungkan...</span></div>
</div></header>

<main class="container">
<section class="panel">
<div class="title">Ronde</div>
<div class="rounds" id="roundList"></div>
<div class="row" style="margin-top:14px">
<input id="roundName" placeholder="Nama ronde, contoh: Ronde 1">
<button class="primary" id="addRound">+ Tambah Ronde</button>
</div>
</section>

<section class="panel">
<div class="title">Peserta</div>
<div class="row">
<input id="participantName" placeholder="Nama peserta" style="min-width:220px">
<button class="success" id="addParticipant">+ Tambah Peserta</button>
</div>
<div class="sub" style="margin-top:9px">Urutan peserta di server tetap. Ranking hanya dihitung di display.</div>
</section>

<section class="panel">
<div class="title" id="scoreTitle">Penilaian</div>
<div id="participantList"></div>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getDatabase,ref,onValue,set,update,push,remove,runTransaction} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

/* ===== ISI DENGAN CONFIG FIREBASE ANDA ===== */
const firebaseConfig={
  apiKey:"ISI_API_KEY",
  authDomain:"ISI_PROJECT.firebaseapp.com",
  databaseURL:"https://ISI_PROJECT-default-rtdb.firebaseio.com",
  projectId:"ISI_PROJECT",
  storageBucket:"ISI_PROJECT.firebasestorage.app",
  messagingSenderId:"ISI_MESSAGING_SENDER_ID",
  appId:"ISI_APP_ID"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

let rounds={},participants={},scores={};
let activeRoundId=null;

const $=id=>document.getElementById(id);

onValue(ref(db,".info/connected"),s=>{
  const ok=s.val()===true;
  $("status").textContent=ok?"Realtime terhubung":"Tidak terhubung";
  $("dot").style.background=ok?"#22c55e":"#ef4444";
});

onValue(ref(db,"competition/rounds"),s=>{
  rounds=s.val()||{};
  const ids=Object.keys(rounds);
  if(!activeRoundId || !rounds[activeRoundId]) activeRoundId=ids[0]||null;
  renderRounds(); render();
});

onValue(ref(db,"competition/participants"),s=>{
  participants=s.val()||{}; render();
});

onValue(ref(db,"competition/scores"),s=>{
  scores=s.val()||{}; render();
});

$("addRound").onclick=async()=>{
  const name=$("roundName").value.trim();
  if(!name)return alert("Masukkan nama ronde.");
  const r=push(ref(db,"competition/rounds"));
  await set(r,{name,order:Object.keys(rounds).length+1,createdAt:Date.now()});
  activeRoundId=r.key;
  $("roundName").value="";
};

$("addParticipant").onclick=async()=>{
  const name=$("participantName").value.trim();
  if(!name)return alert("Masukkan nama peserta.");
  const r=push(ref(db,"competition/participants"));
  await set(r,{name,order:Object.keys(participants).length+1,createdAt:Date.now()});
  $("participantName").value="";
};

function renderRounds(){
  const box=$("roundList"); box.innerHTML="";
  Object.entries(rounds).sort((a,b)=>(a[1].order||0)-(b[1].order||0)).forEach(([id,r])=>{
    const b=document.createElement("button");
    b.className="round "+(id===activeRoundId?"active":"");
    b.textContent=r.name||"Ronde";
    b.onclick=()=>{activeRoundId=id;renderRounds();render()};
    box.appendChild(b);
  });
  if(!Object.keys(rounds).length)box.innerHTML='<div class="sub">Belum ada ronde.</div>';
}

function render(){
  const box=$("participantList"); box.innerHTML="";
  $("scoreTitle").textContent=activeRoundId&&rounds[activeRoundId]
    ?"Penilaian — "+rounds[activeRoundId].name:"Penilaian";
  if(!activeRoundId){
    box.innerHTML='<div class="empty">Buat atau pilih ronde terlebih dahulu.</div>';return;
  }
  const list=Object.entries(participants).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  if(!list.length){box.innerHTML='<div class="empty">Belum ada peserta.</div>';return;}

  list.forEach(([id,p],i)=>{
    const value=Number(scores?.[activeRoundId]?.[id]??0);
    const card=document.createElement("div");card.className="participant";
    card.innerHTML=`
      <div class="head">
        <div class="info">
          <div class="num">${i+1}</div>
          <div><div class="name">${esc(p.name||"Tanpa Nama")}</div><div class="sub">Peserta ${i+1}</div></div>
        </div>
        <div class="score">${value}</div>
      </div>
      <div class="controls">
        <button class="scorebtn minus" data-id="${id}" data-delta="-100">−100</button>
        <button class="scorebtn minus" data-id="${id}" data-delta="-50">−50</button>
        <button class="scorebtn minus" data-id="${id}" data-delta="-10">−10</button>
        <button class="scorebtn minus" data-id="${id}" data-delta="-1">−1</button>
        <button class="scorebtn plus" data-id="${id}" data-delta="1">+1</button>
        <button class="scorebtn plus" data-id="${id}" data-delta="10">+10</button>
        <button class="scorebtn plus" data-id="${id}" data-delta="50">+50</button>
        <button class="scorebtn plus" data-id="${id}" data-delta="100">+100</button>
        <button class="light editScore" data-id="${id}">✏ Edit Nilai</button>
      </div>
      <div class="controls" style="margin-top:8px">
        <button class="light editName" data-id="${id}">✏ Edit Nama</button>
        <button class="danger delete" data-id="${id}">Hapus</button>
      </div>`;
    box.appendChild(card);
  });

  box.querySelectorAll("[data-delta]").forEach(b=>b.onclick=()=>changeScore(b.dataset.id,Number(b.dataset.delta)));
  box.querySelectorAll(".editScore").forEach(b=>b.onclick=()=>editScore(b.dataset.id));
  box.querySelectorAll(".editName").forEach(b=>b.onclick=()=>editName(b.dataset.id));
  box.querySelectorAll(".delete").forEach(b=>b.onclick=()=>deleteParticipant(b.dataset.id));
}

async function changeScore(id,delta){
  if(!activeRoundId)return;
  const r=ref(db,`competition/scores/${activeRoundId}/${id}`);
  await runTransaction(r,current=>{
    let n=Number(current||0)+delta;
    return Math.max(0,n);
  });
}

async function editScore(id){
  if(!activeRoundId)return;
  const current=Number(scores?.[activeRoundId]?.[id]??0);
  const input=prompt("Masukkan nilai baru:",current);
  if(input===null)return;
  const n=Number(input);
  if(!Number.isFinite(n)||n<0)return alert("Nilai tidak valid.");
  await set(ref(db,`competition/scores/${activeRoundId}/${id}`),n);
}

async function editName(id){
  const p=participants[id];if(!p)return;
  const name=prompt("Nama peserta:",p.name||"");
  if(name===null||!name.trim())return;
  await update(ref(db,`competition/participants/${id}`),{name:name.trim()});
}

async function deleteParticipant(id){
  const p=participants[id];if(!p)return;
  if(!confirm(`Hapus peserta "${p.name}"?`))return;
  await remove(ref(db,`competition/participants/${id}`));
  for(const rid of Object.keys(scores||{})){
    await remove(ref(db,`competition/scores/${rid}/${id}`));
  }
}

function esc(v){
  return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
</script>
</body>
</html>
